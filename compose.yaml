x-application: &application
  image: distributed-emergency-call-processing:local
  build:
    context: .
  env_file:
    - .env
  init: true

x-application-environment: &application-environment
  EMERGENCY_PROCESSING_ROOT: /app
  REDIS_URL: redis://${REDIS_HOST:-redis}:${REDIS_PORT:-6379}/${REDIS_DB:-0}
  PIPELINE_METADATA_KEY: ${PIPELINE_METADATA_KEY:-emergency_processing:batch}

services:
  redis:
    image: redis:7.4-alpine
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 2s
      timeout: 3s
      retries: 30
    restart: unless-stopped

  producer:
    <<: *application
    command: ["python", "-m", "emergency_processing.redis_pipeline.producer"]
    environment:
      <<: *application-environment
      DISPATCHER_REDIS_URL: redis://${REDIS_HOST:-redis}:${REDIS_PORT:-6379}/${REDIS_DB:-0}
      JSONL_PATH: data/sample_calls_en.jsonl
    depends_on:
      redis:
        condition: service_healthy
    volumes:
      - ./data:/app/data:ro
    restart: "no"

  worker:
    <<: *application
    command: ["python", "-m", "emergency_processing.redis_pipeline.worker"]
    environment:
      <<: *application-environment
      DYNAMIC_REDIS_URL: redis://${REDIS_HOST:-redis}:${REDIS_PORT:-6379}/${REDIS_DB:-0}
      HF_HOME: /cache/huggingface
    depends_on:
      producer:
        condition: service_completed_successfully
    volumes:
      - huggingface_cache:/cache/huggingface
    restart: unless-stopped
    stop_grace_period: 30s

  collector:
    <<: *application
    command: ["python", "-m", "emergency_processing.redis_pipeline.collector"]
    environment:
      <<: *application-environment
      COLLECTOR_REDIS_URL: redis://${REDIS_HOST:-redis}:${REDIS_PORT:-6379}/${REDIS_DB:-0}
      COLLECTOR_BLOCK_MS: ${COLLECTOR_BLOCK_MS:-5000}
      REDIS_RESULTS_JSONL: outputs/redis_results.jsonl
    depends_on:
      producer:
        condition: service_completed_successfully
    volumes:
      - ./outputs:/app/outputs
    restart: "no"

  reset:
    <<: *application
    profiles: ["maintenance"]
    command: ["python", "-m", "emergency_processing.redis_pipeline.reset"]
    environment:
      <<: *application-environment
      RESET_REDIS_URL: redis://${REDIS_HOST:-redis}:${REDIS_PORT:-6379}/${REDIS_DB:-0}
    depends_on:
      redis:
        condition: service_healthy
    restart: "no"

  test-redis:
    image: redis:7.4-alpine
    profiles: ["test"]
    command: ["redis-server", "--save", "", "--appendonly", "no"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 2s
      timeout: 3s
      retries: 30
    tmpfs:
      - /data
    restart: "no"

  tests:
    image: distributed-emergency-call-processing:test
    build:
      context: .
      target: test
    environment:
      EMERGENCY_PROCESSING_ROOT: /app
      REDIS_URL: redis://test-redis:6379/15
      TEST_REDIS_URL: redis://test-redis:6379/15
    depends_on:
      test-redis:
        condition: service_healthy
    profiles: ["test"]
    restart: "no"

volumes:
  huggingface_cache:
